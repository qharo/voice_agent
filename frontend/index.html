<!doctype html>
<html>
    <head>
        <title>Voice Agent</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --green: #a5d6a7;
                --black: #000000;
                --white: #ffffff;
                --user-text: var(--black);
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                font-family:
                    "Roboto",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: var(--green);
                color: var(--black);
                transition: background-color 0.6s ease;
                overflow: hidden;
            }
            body.active {
                background: var(--black);
                color: var(--white);
                --user-text: var(--green);
            }
            #app {
                position: relative;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            #conversation {
                flex: 1;
                width: min(60%, 760px);
                margin: 0 auto;
                padding: 28px 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
                scrollbar-width: none;
            }
            #conversation::-webkit-scrollbar {
                display: none;
            }
            @media (max-width: 768px) {
                #conversation {
                    width: 90%;
                }
            }
            .message {
                white-space: pre-wrap;
                word-wrap: break-word;
                font-size: 20px;
                line-height: 1.55;
                width: 100%;
                max-width: none;
            }
            .user-msg {
                align-self: flex-end;
                color: var(--user-text);
                text-align: right;
            }
            .tool-icon {
                align-self: flex-start;
                font-size: 22px;
                color: var(--white);
                line-height: 1.2;
            }
            .agent-msg {
                align-self: flex-start;
                color: var(--white);
                text-align: left;
            }
            .streaming-msg {
                align-self: flex-start;
                color: var(--white);
            }
            .error-msg {
                align-self: center;
                color: #ffd6d6;
            }
            #bottom {
                flex-shrink: 0;
                display: flex;
                flex-direction: column;
                align-items: center;
                gap: 12px;
                padding: 0 0 30px;
            }
            #viz {
                width: min(60%, 640px);
                height: 60px;
                pointer-events: none;
            }
            @media (max-width: 768px) {
                #viz {
                    width: 90%;
                }
            }
            #idlePrompt {
                font-size: 16px;
                min-height: 24px;
                font-weight: 500;
                letter-spacing: 0.3px;
                text-align: center;
                color: var(--black);
                transition: color 0.6s ease, opacity 0.6s ease;
            }
            body.active #idlePrompt {
                color: var(--white);
            }
            body.agent #idlePrompt {
                opacity: 0.55;
            }
            #aboutLink {
                position: fixed;
                top: 18px;
                right: 18px;
                z-index: 10;
                display: flex;
                align-items: center;
                justify-content: center;
                width: 34px;
                height: 34px;
                color: var(--black);
                opacity: 0.5;
                transition: color 0.6s ease, opacity 0.3s ease;
                border-radius: 50%;
            }
            #aboutLink:hover {
                opacity: 1;
            }
            #aboutLink svg {
                width: 22px;
                height: 22px;
                stroke: currentColor;
                stroke-width: 1.8;
                fill: none;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            body.active #aboutLink {
                color: var(--white);
            }
        </style>
    </head>
    <body>
        <div id="app">
            <a href="about.html" id="aboutLink" target="_blank" rel="noopener" aria-label="About this voice agent" title="About this voice agent">
                <svg viewBox="0 0 24 24">
                    <circle cx="12" cy="12" r="9"></circle>
                    <line x1="12" y1="11" x2="12" y2="16"></line>
                    <line x1="12" y1="8" x2="12" y2="8.5"></line>
                </svg>
            </a>
            <div id="conversation"></div>
            <div id="bottom">
                <canvas id="viz"></canvas>
                <div id="idlePrompt">press space to speak now</div>
            </div>
        </div>

        <script>
            const conversation = document.getElementById("conversation");
            const idlePrompt = document.getElementById("idlePrompt");

            let ws = null;
            let audioContext = null;
            let processor = null;
            let micAnalyser = null;
            let stream = null;
            let isRecording = false;
            let state = "idle"; // idle | recording | processing | agent
            let streamingDiv = null;
            let liveTransDiv = null;
            let audioQueue = [];
            let currentAudio = null;
            let isPlayingAudio = false;
            let discardTurn = false;
            let shouldReconnect = true;

            const player = {
                ctx: null,
                active: false,
                sampleRate: 24000,
                nextPlayTime: 0,
                sources: [],
                start(sr) {
                    if (this.ctx) {
                        if (this.ctx.state === "suspended") this.ctx.resume();
                    } else {
                        this.ctx = new (window.AudioContext ||
                            window.webkitAudioContext)();
                        this.ctx.resume();
                    }
                    if (!this.analyser) {
                        this.analyser = this.ctx.createAnalyser();
                        this.analyser.fftSize = 256;
                        this.analyser.smoothingTimeConstant = 0.8;
                        this.analyser.connect(this.ctx.destination);
                    }
                    this.sampleRate = sr;
                    this.active = true;
                    this.sources = [];
                    this.nextPlayTime = this.ctx.currentTime + 0.15;
                    isPlayingAudio = true;
                },
                push(buffer) {
                    if (!this.active) return;
                    const n = buffer.byteLength / 2;
                    const i16 = new Int16Array(buffer);
                    const f32 = new Float32Array(n);
                    for (let i = 0; i < n; i++) {
                        f32[i] = Math.max(-1, Math.min(1, i16[i] / 32768));
                    }
                    const audioBuffer = this.ctx.createBuffer(
                        1,
                        n,
                        this.sampleRate,
                    );
                    audioBuffer.copyToChannel(f32, 0);
                    const src = this.ctx.createBufferSource();
                    src.buffer = audioBuffer;
                    src.connect(this.analyser);
                    const when = Math.max(
                        this.nextPlayTime,
                        this.ctx.currentTime,
                    );
                    src.start(when);
                    this.nextPlayTime = when + n / this.sampleRate;
                    this.sources.push(src);
                    src.onended = () => {
                        this.sources.shift();
                        if (!this.active && this.sources.length === 0) {
                            isPlayingAudio = false;
                            if (state === "agent") returnIdle();
                        }
                    };
                },
                end() {
                    this.active = false;
                    if (this.sources.length === 0) {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                },
                stop() {
                    this.active = false;
                    this.sources.forEach((src) => {
                        try {
                            src.stop();
                        } catch (e) {}
                    });
                    this.sources = [];
                    isPlayingAudio = false;
                },
            };

            function setActive(on) {
                document.body.classList.toggle("active", on);
            }

            function setAgent(on) {
                document.body.classList.toggle("agent", on);
            }

            function stopAllAudio() {
                player.stop();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                audioQueue.forEach((url) => URL.revokeObjectURL(url));
                audioQueue = [];
                isPlayingAudio = false;
            }

            function returnIdle() {
                state = "idle";
                setActive(false);
                setAgent(false);
                idlePrompt.textContent = "press space to speak now";
            }

            function initViz() {
                const canvas = document.getElementById("viz");
                const ctx = canvas.getContext("2d");
                const BAR_COUNT = 40;
                const freq = new Uint8Array(128);
                let measuredW = -1;
                let idleSince = null;

                function fit() {
                    const dpr = window.devicePixelRatio || 1;
                    const w = canvas.clientWidth;
                    const h = canvas.clientHeight;
                    if (w <= 0 || h <= 0) return;
                    canvas.width = Math.round(w * dpr);
                    canvas.height = Math.round(h * dpr);
                    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
                    measuredW = w;
                }
                window.addEventListener("resize", fit);
                fit();

                function drawBars(color, alpha) {
                    ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
                    const n = canvas.clientWidth;
                    const h = canvas.clientHeight;
                    const gap = 2;
                    const bw = (n - gap * (BAR_COUNT - 1)) / BAR_COUNT;
                    ctx.fillStyle = color;
                    ctx.globalAlpha = alpha == null ? 1 : alpha;
                    for (let i = 0; i < BAR_COUNT; i++) {
                        let sum = 0;
                        const s = Math.floor((i * 128) / BAR_COUNT);
                        const e = Math.floor(((i + 1) * 128) / BAR_COUNT);
                        for (let b = s; b < e; b++) sum += freq[b];
                        const v = sum / Math.max(1, e - s) / 255;
                        const bh = Math.max(2, v * h);
                        const r = 6;
                        const x = i * (bw + gap);
                        const y = h - bh;
                        if (r >= bw / 2) {
                            ctx.fillRect(x, y, bw, bh);
                        } else {
                            ctx.beginPath();
                            ctx.moveTo(x, y + r);
                            ctx.arc(x + r, y + r, r, Math.PI, 1.5 * Math.PI);
                            ctx.lineTo(x + bw - r, y);
                            ctx.arc(x + bw - r, y + r, r, 1.5 * Math.PI, 2 * Math.PI);
                            ctx.lineTo(x + bw, y + bh);
                            ctx.lineTo(x, y + bh);
                            ctx.closePath();
                            ctx.fill();
                        }
                    }
                    ctx.globalAlpha = 1;
                }

                function tick() {
                    requestAnimationFrame(tick);
                    const active = document.body.classList.contains("active");
                    if (active && (canvas.width === 0 || canvas.clientWidth !== measuredW)) fit();
                    if (!active) {
                        if (idleSince === null) idleSince = performance.now();
                        const elapsed = performance.now() - idleSince;
                        const HOLD = 500;
                        const FADE = 400;
                        let alpha;
                        if (elapsed < HOLD) alpha = 0.15;
                        else if (elapsed < HOLD + FADE) alpha = 0.15 * (1 - (elapsed - HOLD) / FADE);
                        else alpha = 0;
                        if (alpha > 0) {
                            freq.fill(0);
                            drawBars("#000000", alpha);
                        } else {
                            ctx.clearRect(0, 0, canvas.clientWidth, canvas.clientHeight);
                        }
                        return;
                    }
                    idleSince = null;
                    const src = (isRecording && micAnalyser) ? micAnalyser
                        : (player.analyser && (player.active || player.sources.length > 0)) ? player.analyser
                        : null;
                    if (!src) {
                        drawBars("#5a5a5e", 0.35);
                        return;
                    }
                    src.getByteFrequencyData(freq);
                    drawBars(isRecording && micAnalyser ? "#a5d6a7" : "#ffffff", 1);
                }
                tick();
            }

            initViz();

            function connectWebSocket() {
                const protocol =
                    window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(
                    `${protocol}//${window.location.hostname}/ws`,
                );
                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    if (!isRecording && !isPlayingAudio) {
                        idlePrompt.textContent = "press space to speak now";
                    }
                };

                ws.onclose = () => {
                    if (shouldReconnect) {
                        idlePrompt.textContent = "reconnecting...";
                        setTimeout(connectWebSocket, 1000);
                    }
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        if (discardTurn) return;
                        if (player.active) {
                            player.push(event.data);
                        } else {
                            const blob = new Blob([event.data], {
                                type: "audio/wav",
                            });
                            const audioUrl = URL.createObjectURL(blob);
                            if (isPlayingAudio) {
                                audioQueue.push(audioUrl);
                            } else {
                                playAudio(audioUrl);
                            }
                        }
                    } else {
                        const text = event.data;

                        if (text.startsWith("[AUDIO_BEGIN:")) {
                            if (discardTurn) return;
                            const meta = text.substring(
                                "[AUDIO_BEGIN:".length,
                                text.length - 1,
                            );
                            const sr = parseInt(meta.split(":")[0], 10);
                            state = "agent";
                            setActive(true);
                            setAgent(true);
                            idlePrompt.textContent = "press space to interrupt";
                            player.start(sr);
                        } else if (text === "[AUDIO_END]") {
                            player.end();
                        } else if (text === "[END]") {
                            if (streamingDiv) {
                                streamingDiv.classList.remove(
                                    "streaming-msg",
                                );
                                streamingDiv.classList.add("agent-msg");
                                streamingDiv = null;
                            }
                            if (discardTurn) {
                                discardTurn = false;
                            } else {
                                if (liveTransDiv) {
                                    liveTransDiv.remove();
                                    liveTransDiv = null;
                                }
                                if (!isRecording && !isPlayingAudio) {
                                    returnIdle();
                                }
                            }
                        } else if (text.startsWith("[TRANS:")) {
                            if (discardTurn) return;
                            const liveText = text.substring(
                                7,
                                text.length - 1,
                            );
                            if (!liveTransDiv) {
                                liveTransDiv = document.createElement("div");
                                liveTransDiv.className = "message user-msg";
                                conversation.appendChild(liveTransDiv);
                            }
                            liveTransDiv.textContent = liveText;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[STREAM:")) {
                            if (discardTurn) return;
                            const token = text.substring(8, text.length - 1);
                            if (!streamingDiv) {
                                streamingDiv = document.createElement("div");
                                streamingDiv.className =
                                    "message streaming-msg";
                                conversation.appendChild(streamingDiv);
                            }
                            streamingDiv.textContent += token;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[TOOL:")) {
                            if (discardTurn) return;
                            showToolIcon(
                                text.substring("[TOOL:".length, text.length - 1),
                            );
                        } else if (text.startsWith("[ERROR:")) {
                            addMessage(text, "error");
                        } else {
                            if (liveTransDiv) {
                                liveTransDiv.remove();
                                liveTransDiv = null;
                            }
                            const isUser = text.startsWith("You:");
                            const clean = isUser ? text.substring(5) : text;
                            addMessage(clean, isUser ? "user" : "agent");
                        }
                    }
                };
            }

            connectWebSocket();

            const TOOL_ICONS = {
                get_weather: "🌤️",
                calculator: "🧮",
                wikipedia: "📖",
                exchange_rate: "💱",
                world_time: "🕐",
                dictionary: "📚",
            };

            function showToolIcon(name) {
                const icon = TOOL_ICONS[name] || "🛠️";
                const div = document.createElement("div");
                div.className = "message tool-icon";
                div.textContent = icon;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            function playAudio(url) {
                isPlayingAudio = true;
                const audio = new Audio(url);
                currentAudio = audio;
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    if (currentAudio === audio) currentAudio = null;
                    if (audioQueue.length > 0) {
                        playAudio(audioQueue.shift());
                    } else {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                };
                audio.play();
            }

            function addMessage(text, sender) {
                const div = document.createElement("div");
                div.className = `message ${sender}-msg`;
                div.textContent = text;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            async function startRecording() {
                if (isRecording) return;
                if (isPlayingAudio) {
                    // interrupt ongoing assistant playback
                    stopAllAudio();
                    discardTurn = true;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send("CANCEL");
                    }
                }
                if (liveTransDiv) {
                    liveTransDiv.remove();
                    liveTransDiv = null;
                }
                if (streamingDiv) {
                    streamingDiv.classList.remove("streaming-msg");
                    streamingDiv.classList.add("agent-msg");
                    streamingDiv = null;
                }
                state = "recording";
                setActive(true);
                setAgent(false);
                idlePrompt.textContent = "";
                try {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        idlePrompt.textContent = "still connecting...";
                        setActive(false);
                        state = "idle";
                        return;
                    }

                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: 16000, channelCount: 1 },
                    });

                    audioContext = new AudioContext({ sampleRate: 16000 });

                    if (player.ctx && player.ctx.state === "suspended") {
                        player.ctx.resume();
                    }

                    const source = audioContext.createMediaStreamSource(stream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    micAnalyser = audioContext.createAnalyser();
                    micAnalyser.fftSize = 256;
                    micAnalyser.smoothingTimeConstant = 0.8;

                    processor.onaudioprocess = (e) => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);
                            const pcm16 = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcm16[i] =
                                    Math.max(-1, Math.min(1, inputData[i])) *
                                    0x7fff;
                            }
                            ws.send(pcm16.buffer);
                        }
                    };

                    source.connect(micAnalyser);
                    micAnalyser.connect(processor);
                    processor.connect(audioContext.destination);

                    isRecording = true;
                    conversation.scrollTop = conversation.scrollHeight;
                } catch (err) {
                    state = "idle";
                    setActive(false);
                    idlePrompt.textContent =
                        "mic error: " +
                        (navigator.mediaDevices
                            ? err.message
                            : "requires https or localhost");
                }
            }

            function stopRecording() {
                if (!isRecording) return;

                if (processor) {
                    processor.disconnect();
                    processor = null;
                }
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
                micAnalyser = null;
                if (stream) {
                    stream.getTracks().forEach((t) => t.stop());
                    stream = null;
                }
                isRecording = false;
                state = "processing";
                setActive(true);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send("stop");
                }
            }

            document.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    if (!e.repeat) startRecording();
                }
            });
            document.addEventListener("keyup", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    stopRecording();
                }
            });
        </script>
    </body>
</html>
