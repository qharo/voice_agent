<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <title>Voice Agent</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --green: #a5d6a7;
                --black: #000000;
                --white: #ffffff;
                --assistant: #2e7d32;
                --user-text: var(--black);
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            html {
                -webkit-text-size-adjust: 100%;
            }
            body {
                font-family:
                    "Roboto",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: var(--green);
                color: var(--black);
                transition: background-color 0.6s ease;
                overflow: hidden;
                overscroll-behavior: none;
                touch-action: manipulation;
            }
            body.active {
                background: var(--black);
                color: var(--white);
                --user-text: var(--green);
            }
            #app {
                position: relative;
                height: 100vh;
                height: 100svh;
                height: 100dvh;
                display: flex;
                flex-direction: column;
                padding-top: env(safe-area-inset-top, 0px);
            }
            #conversation {
                flex: 1;
                width: min(760px, calc(100% - 32px));
                margin: 0 auto;
                padding: 20px 0 12px;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
                scrollbar-width: none;
                touch-action: pan-x pan-y;
                overscroll-behavior: contain;
                -webkit-touch-callout: none;
                user-select: none;
            }
            #conversation::-webkit-scrollbar {
                display: none;
            }
            @media (min-width: 1100px) {
                #conversation {
                    width: min(60%, 760px);
                    padding: 28px 0;
                }
            }
            @media (max-width: 520px) {
                #conversation {
                    width: calc(100% - 24px);
                    padding: 14px 0 8px;
                    gap: 10px;
                }
            }
            .message {
                white-space: pre-wrap;
                word-wrap: break-word;
                font-size: clamp(17px, 2.6vw, 20px);
                line-height: 1.55;
                width: 100%;
                max-width: none;
            }
            .user-msg {
                align-self: flex-end;
                color: var(--user-text);
                text-align: right;
            }
            .tool-icon {
                align-self: flex-start;
                font-size: 22px;
                color: var(--white);
                line-height: 1.2;
            }
            .agent-msg {
                align-self: flex-start;
                color: var(--assistant);
                text-align: left;
                transition: color 0.6s ease;
            }
            .streaming-msg {
                align-self: flex-start;
                color: var(--assistant);
                transition: color 0.6s ease;
            }
            body.active .agent-msg,
            body.active .streaming-msg {
                color: var(--white);
            }
            .error-msg {
                align-self: center;
                color: #ffd6d6;
            }
            #idlePrompt {
                flex-shrink: 0;
                padding: 0 16px calc(20px + env(safe-area-inset-bottom, 0px));
                font-size: clamp(14px, 3.8vw, 16px);
                min-height: 24px;
                font-weight: 500;
                letter-spacing: 0.3px;
                text-align: center;
                color: var(--black);
                transition: color 0.6s ease, opacity 0.12s ease;
                -webkit-touch-callout: none;
                user-select: none;
            }
            body.active #idlePrompt {
                color: var(--white);
            }
            #queueStatus {
                flex-shrink: 0;
                padding: 0 16px 8px;
                font-size: clamp(12px, 3.4vw, 13px);
                min-height: 0;
                text-align: center;
                color: var(--black);
                opacity: 0.75;
                letter-spacing: 0.3px;
                transition: color 0.6s ease;
            }
            body.active #queueStatus {
                color: var(--white);
            }
            #topbar {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                gap: 12px;
                padding: 12px 14px 12px 18px;
            }
            .brand {
                font-size: clamp(18px, 4.5vw, 22px);
                font-weight: 700;
                letter-spacing: 0.2px;
                color: var(--black);
                text-decoration: none;
                transition: color 0.6s ease;
                white-space: nowrap;
            }
            body.active .brand {
                color: var(--white);
            }
            .nav-link {
                display: flex;
                align-items: center;
                min-height: 44px;
                padding: 0 12px;
                font-size: clamp(14px, 3.8vw, 16px);
                font-weight: 500;
                letter-spacing: 0.2px;
                color: var(--black);
                text-decoration: none;
                white-space: nowrap;
                border-radius: 999px;
                opacity: 0.65;
                transition: color 0.6s ease, opacity 0.3s ease;
            }
            .nav-link:hover {
                opacity: 1;
                text-decoration: underline;
                text-underline-offset: 4px;
            }
            .nav-link:focus-visible {
                opacity: 1;
                outline: 2px solid currentColor;
                outline-offset: 2px;
            }
            body.active .nav-link {
                color: var(--white);
            }
            .github-icon {
                display: none;
                width: 22px;
                height: 22px;
                fill: currentColor;
            }
            .topbar-actions {
                display: flex;
                align-items: center;
                gap: 8px;
            }
            .corner-btn {
                display: flex;
                align-items: center;
                justify-content: center;
                width: 44px;
                height: 44px;
                color: var(--black);
                opacity: 0.5;
                transition: color 0.6s ease, opacity 0.3s ease;
                border-radius: 50%;
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
            }
            .corner-btn:hover {
                opacity: 1;
            }
            .corner-btn.active {
                opacity: 1;
            }
            .corner-btn svg {
                width: 22px;
                height: 22px;
                stroke: currentColor;
                stroke-width: 1.8;
                fill: none;
                stroke-linecap: round;
                stroke-linejoin: round;
            }
            body.active .corner-btn {
                color: var(--white);
            }
            #sidebarBackdrop {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.35);
                z-index: 15;
                opacity: 0;
                transition: opacity 0.3s ease;
                pointer-events: none;
            }
            body.sidebar-open #sidebarBackdrop {
                opacity: 1;
                pointer-events: auto;
            }
            #sidebar {
                position: fixed;
                top: 0;
                right: 0;
                height: 100vh;
                height: 100svh;
                height: 100dvh;
                width: min(360px, 94vw);
                background: #ffffff;
                color: #000000;
                box-shadow: -8px 0 30px rgba(0, 0, 0, 0.25);
                transform: translateX(100%);
                transition: transform 0.3s ease;
                z-index: 20;
                display: flex;
                flex-direction: column;
            }
            body.sidebar-open #sidebar {
                transform: translateX(0);
            }
            .sidebar-header {
                flex-shrink: 0;
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding: 14px 18px;
                border-bottom: 1px solid rgba(0, 0, 0, 0.12);
            }
            .sidebar-title {
                font-size: 18px;
                font-weight: 700;
                letter-spacing: 0.2px;
            }
            .sidebar-body {
                flex: 1;
                overflow-y: auto;
                padding: 22px 20px calc(32px + env(safe-area-inset-bottom, 0px));
                scrollbar-width: none;
                overscroll-behavior: contain;
            }
            .sidebar-body::-webkit-scrollbar {
                display: none;
            }
            .sidebar-section {
                margin-bottom: 30px;
            }
            .sidebar-section h3 {
                font-size: 15px;
                font-weight: 700;
                margin: 0 0 12px;
                letter-spacing: 0.2px;
            }
            #promptInput {
                width: 100%;
                font-family: inherit;
                font-size: 16px;
                line-height: 1.5;
                color: #000;
                background: #fff;
                border: 1px solid rgba(0, 0, 0, 0.25);
                border-radius: 10px;
                padding: 12px;
                resize: vertical;
                box-sizing: border-box;
                scrollbar-width: thin;
                scrollbar-color: rgba(0, 0, 0, 0.25) transparent;
            }
            #promptInput:focus {
                outline: none;
                border-color: rgba(0, 0, 0, 0.6);
            }
            #promptInput::-webkit-scrollbar {
                width: 8px;
            }
            #promptInput::-webkit-scrollbar-track {
                background: transparent;
            }
            #promptInput::-webkit-scrollbar-thumb {
                background: rgba(0, 0, 0, 0.18);
                border-radius: 999px;
                border: 2px solid #fff;
            }
            #promptInput::-webkit-scrollbar-thumb:hover {
                background: rgba(0, 0, 0, 0.32);
            }
            .sidebar-actions {
                display: flex;
                flex-wrap: wrap;
                gap: 8px;
                margin-top: 10px;
            }
            .btn-primary,
            .btn-ghost {
                font-family: inherit;
                font-size: 15px;
                font-weight: 500;
                border-radius: 999px;
                padding: 10px 18px;
                min-height: 44px;
                cursor: pointer;
                transition: opacity 0.2s ease;
            }
            .btn-primary {
                background: #000;
                color: #fff;
                border: none;
            }
            .btn-ghost {
                background: transparent;
                color: #000;
                border: 1px solid rgba(0, 0, 0, 0.35);
            }
            .btn-primary:hover,
            .btn-ghost:hover {
                opacity: 0.75;
            }
            .sidebar-status {
                margin-top: 10px;
                font-size: 13px;
                line-height: 1.5;
                opacity: 0.8;
                min-height: 18px;
            }
            .sidebar-status.error {
                color: #c0392b;
                opacity: 1;
            }
            .sidebar-status.success {
                color: var(--assistant);
                opacity: 1;
            }
            .sidebar-status.success::before {
                content: "✓ ";
                font-weight: 700;
            }
            .sidebar-status.show {
                animation: fadeInStatus 0.25s ease;
            }
            @keyframes fadeInStatus {
                from {
                    opacity: 0;
                    transform: translateY(4px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            .doc-download {
                display: inline-block;
                margin-top: 10px;
                font-size: 14px;
                line-height: 1.5;
                font-weight: 700;
                color: inherit;
                text-decoration: none;
                overflow-wrap: anywhere;
            }
            .doc-download:hover {
                text-decoration: underline;
                text-underline-offset: 3px;
            }
            .doc-download:focus-visible {
                outline: 2px solid currentColor;
                outline-offset: 2px;
            }
            .doc-remove {
                margin-top: 8px;
                font-family: inherit;
                font-size: 13px;
                font-weight: 500;
                color: #c0392b;
                background: none;
                border: none;
                padding: 0;
                cursor: pointer;
                text-decoration: underline;
            }
            .preset-hint {
                font-size: 13px;
                line-height: 1.5;
                opacity: 0.75;
                margin: 0 0 10px;
            }
            .preset-select {
                width: 100%;
                font-family: inherit;
                font-size: 16px;
                color: #000;
                background: #fff;
                border: 1px solid rgba(0, 0, 0, 0.25);
                border-radius: 10px;
                padding: 12px;
                box-sizing: border-box;
                cursor: pointer;
                min-height: 44px;
            }
            .preset-select:focus {
                outline: none;
                border-color: rgba(0, 0, 0, 0.6);
            }
            @media (max-width: 420px) {
                #topbar {
                    gap: 4px;
                    padding: 8px 8px 8px 14px;
                }
                .topbar-actions {
                    gap: 2px;
                }
                .nav-link {
                    min-height: 44px;
                    padding: 0 8px;
                }
            }
            @media (max-width: 360px) {
                .github-label {
                    display: none;
                }
                .github-icon {
                    display: block;
                }
            }
            @media (max-height: 520px) and (orientation: landscape) {
                #topbar {
                    padding-top: 6px;
                    padding-bottom: 6px;
                }
                #conversation {
                    padding: 10px 0 6px;
                }
                #idlePrompt {
                    padding-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
                }
            }
            @media (prefers-reduced-motion: reduce) {
                body,
                .agent-msg,
                .streaming-msg,
                .nav-link,
                .corner-btn {
                    transition: none;
                }
            }
        </style>
    </head>
    <body>

                <a class="brand" href="index.html">Voice Agent</a>
                <nav class="topbar-actions">
                    <a href="about.html" class="nav-link">About</a>
                    <a
                        href="https://github.com/qharo/voice_agent"
                        class="nav-link"
                        target="_blank"
                        rel="noopener"
                        aria-label="Voice Agent source code on GitHub"
                        ><svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                            <path
                                d="M12 .297c-6.63 0-12 5.373-12 12 0 5.303 3.438 9.8 8.205 11.385.6.113.82-.258.82-.577 0-.285-.01-1.04-.015-2.04-3.338.724-4.042-1.61-4.042-1.61C4.422 18.07 3.633 17.7 3.633 17.7c-1.087-.744.084-.729.084-.729 1.205.084 1.838 1.236 1.838 1.236 1.07 1.835 2.809 1.305 3.495.998.108-.776.417-1.305.76-1.605-2.665-.3-5.466-1.332-5.466-5.93 0-1.31.465-2.38 1.235-3.22-.135-.303-.54-1.523.105-3.176 0 0 1.005-.322 3.3 1.23.96-.267 1.98-.399 3-.405 1.02.006 2.04.138 3 .405 2.28-1.552 3.285-1.23 3.285-1.23.645 1.653.24 2.873.12 3.176.765.84 1.23 1.91 1.23 3.22 0 4.61-2.805 5.625-5.475 5.92.42.36.81 1.096.81 2.22 0 1.606-.015 2.896-.015 3.286 0 .315.21.69.825.57C20.565 22.092 24 17.592 24 12.297c0-6.627-5.373-12-12-12"

                    <button id="sidebarToggle" class="corner-btn" aria-label="Settings" title="Settings">
                        <svg viewBox="0 0 24 24">
                            <line x1="4" y1="7" x2="20" y2="7"></line>

        <div id="sidebarBackdrop" hidden></div>
        <aside id="sidebar" aria-label="Settings">
            <div class="sidebar-header">
                <span class="sidebar-title">Settings</span>
                <button id="sidebarClose" class="corner-btn" aria-label="Close settings" title="Close settings">
                    <svg viewBox="0 0 24 24">
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="sidebar-body">
                <section class="sidebar-section">
                    <h3>Presets</h3>
                    <p class="preset-hint">One-click demo that loads a prompt and a document.</p>
                    <select id="presetSelect" class="preset-select"></select>
                    <div id="presetStatus" class="sidebar-status"></div>
                </section>
                <section class="sidebar-section">
                    <h3>Prompt</h3>
                    <textarea id="promptInput" rows="9" spellcheck="false" placeholder="e.g. You are a patient tutor who always explains in simple terms."></textarea>
                    <div class="sidebar-actions">
                        <button id="promptSave" class="btn-primary">Save</button>
                        <button id="promptReset" class="btn-ghost">Reset to default</button>
                    </div>
                    <div id="promptStatus" class="sidebar-status"></div>
                </section>
                <section class="sidebar-section">
                    <h3>Document</h3>
                    <button id="sidebarUpload" class="btn-primary">Upload document</button>
                    <input type="file" id="fileInput" accept=".pdf,.txt,application/pdf,text/plain" hidden />
                    <div id="docStatus" class="sidebar-status"></div>
                </section>
            </div>
        </aside>

        <script>
            const conversation = document.getElementById("conversation");
            const idlePrompt = document.getElementById("idlePrompt");
            const queueStatus = document.getElementById("queueStatus");
            const fileInput = document.getElementById("fileInput");
            const sidebarToggle = document.getElementById("sidebarToggle");
            const sidebarClose = document.getElementById("sidebarClose");
            const sidebarBackdrop = document.getElementById("sidebarBackdrop");
            const promptInput = document.getElementById("promptInput");
            const promptSave = document.getElementById("promptSave");
            const promptReset = document.getElementById("promptReset");
            const promptStatus = document.getElementById("promptStatus");
            const sidebarUpload = document.getElementById("sidebarUpload");
            const docStatus = document.getElementById("docStatus");
            const presetSelect = document.getElementById("presetSelect");
            const presetStatus = document.getElementById("presetStatus");

            let ws = null;
            let audioContext = null;
            let processor = null;
            let micAnalyser = null;
            let listenCtx = null;
            let listenAnalyser = null;
            let listenStream = null;
            let promptLevel = 0;
            let stream = null;
            let isRecording = false;
            let state = "idle"; // idle | recording | processing | agent
            let streamingDiv = null;
            let liveTransDiv = null;
            let audioQueue = [];
            let currentAudio = null;
            let isPlayingAudio = false;
            let discardTurn = false;
            let shouldReconnect = true;
            let cancelPendingStart = false;
            let inputMode =
                window.matchMedia("(pointer: coarse)").matches ||
                "ontouchstart" in window ||
                navigator.maxTouchPoints > 0
                    ? "touch"
                    : "keyboard";
            const TOUCH_HOLD_MS = 500;
            const TOUCH_MOVE_PX = 10;
            let touchHoldTimer = null;
            let touchHoldPointerId = null;
            let touchHoldStartX = 0;
            let touchHoldStartY = 0;
            let touchHoldFired = false;

            const player = {
                ctx: null,
                active: false,
                sampleRate: 24000,
                nextPlayTime: 0,
                sources: [],
                start(sr) {
                    if (this.ctx) {
                        if (this.ctx.state === "suspended") this.ctx.resume();
                    } else {
                        this.ctx = new (window.AudioContext ||
                            window.webkitAudioContext)();
                        this.ctx.resume();
                    }
                    if (!this.analyser) {
                        this.analyser = this.ctx.createAnalyser();
                        this.analyser.fftSize = 256;
                        this.analyser.smoothingTimeConstant = 0.8;
                        this.analyser.connect(this.ctx.destination);
                    }
                    this.sampleRate = sr;
                    this.active = true;
                    this.sources = [];
                    this.nextPlayTime = this.ctx.currentTime + 0.15;
                    isPlayingAudio = true;
                },
                push(buffer) {
                    if (!this.active) return;
                    const n = buffer.byteLength / 2;
                    const i16 = new Int16Array(buffer);
                    const f32 = new Float32Array(n);
                    for (let i = 0; i < n; i++) {
                        f32[i] = Math.max(-1, Math.min(1, i16[i] / 32768));
                    }
                    const audioBuffer = this.ctx.createBuffer(
                        1,
                        n,
                        this.sampleRate,
                    );
                    audioBuffer.copyToChannel(f32, 0);
                    const src = this.ctx.createBufferSource();
                    src.buffer = audioBuffer;
                    src.connect(this.analyser);
                    const when = Math.max(
                        this.nextPlayTime,
                        this.ctx.currentTime,
                    );
                    src.start(when);
                    this.nextPlayTime = when + n / this.sampleRate;
                    this.sources.push(src);
                    src.onended = () => {
                        this.sources.shift();
                        if (!this.active && this.sources.length === 0) {
                            isPlayingAudio = false;
                            if (state === "agent") returnIdle();
                        }
                    };
                },
                end() {
                    this.active = false;
                    if (this.sources.length === 0) {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                },
                stop() {
                    this.active = false;
                    this.sources.forEach((src) => {
                        try {
                            src.stop();
                        } catch (e) {}
                    });
                    this.sources = [];
                    isPlayingAudio = false;
                },
            };

            function setActive(on) {
                document.body.classList.toggle("active", on);
            }

            function setAgent(on) {
                document.body.classList.toggle("agent", on);
            }

            function stopAllAudio() {
                player.stop();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                audioQueue.forEach((url) => URL.revokeObjectURL(url));
                audioQueue = [];
                isPlayingAudio = false;
            }

            function setIdlePrompt(mode) {
                if (mode === "idle") {
                    idlePrompt.textContent =
                        inputMode === "touch"
                            ? "touch and hold to speak now"
                            : "press space to speak now";
                } else if (mode === "recording") {
                    idlePrompt.textContent =
                        inputMode === "touch"
                            ? "listening — release to send"
                            : "listening";
                } else if (mode === "interrupt") {
                    idlePrompt.textContent =
                        inputMode === "touch"
                            ? "touch and hold to interrupt"
                            : "press space to interrupt";
                }
            }

            function returnIdle() {
                state = "idle";
                setActive(false);
                setAgent(false);
                setIdlePrompt("idle");
            }

            (function startMeter() {
                const RMF_FLOOR = 0.008;
                const RMF_CEIL = 0.12;
                let td = new Float32Array(256);
                function tick() {
                    requestAnimationFrame(tick);
                    const src = (isRecording && micAnalyser) ? micAnalyser
                        : (player.analyser && (player.active || player.sources.length > 0)) ? player.analyser
                        : listenAnalyser;
                    let level = 0;
                    if (src) {
                        if (td.length !== src.fftSize) td = new Float32Array(src.fftSize);
                        src.getFloatTimeDomainData(td);
                        let sumSq = 0;
                        for (let i = 0; i < td.length; i++) {
                            const x = td[i];
                            sumSq += x * x;
                        }
                        const rms = Math.sqrt(sumSq / td.length);
                        level = Math.min(1, Math.max(0, (rms - RMF_FLOOR) / (RMF_CEIL - RMF_FLOOR)));
                    }
                    promptLevel += (level - promptLevel) * 0.15;
                    const opacity = (1 - 0.9 * promptLevel).toFixed(3);
                    idlePrompt.style.opacity = opacity;
                    if (isRecording && liveTransDiv) {
                        liveTransDiv.style.opacity = opacity;
                    }
                }
                tick();
            })();

            function connectWebSocket() {
                const protocol =
                    window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(
                    `${protocol}//${window.location.hostname}/ws`,
                );
                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    if (!isRecording && !isPlayingAudio) {
                        setIdlePrompt("idle");
                    }
                };

                ws.onclose = () => {
                    if (shouldReconnect) {
                        idlePrompt.textContent = "reconnecting...";
                        setTimeout(connectWebSocket, 1000);
                    }
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        if (discardTurn) return;
                        if (player.active) {
                            player.push(event.data);
                        } else {
                            const blob = new Blob([event.data], {
                                type: "audio/wav",
                            });
                            const audioUrl = URL.createObjectURL(blob);
                            if (isPlayingAudio) {
                                audioQueue.push(audioUrl);
                            } else {
                                playAudio(audioUrl);
                            }
                        }
                    } else {
                        const text = event.data;

                        if (text.startsWith("[AUDIO_BEGIN:")) {
                            if (discardTurn) return;
                            const meta = text.substring(
                                "[AUDIO_BEGIN:".length,
                                text.length - 1,
                            );
                            const sr = parseInt(meta.split(":")[0], 10);
                            state = "agent";
                            setActive(true);
                            setAgent(true);
                            setIdlePrompt("interrupt");
                            player.start(sr);
                        } else if (text === "[AUDIO_END]") {
                            player.end();
                        } else if (text === "[END]") {
                            if (queueStatus) {
                                queueStatus.textContent = "";
                                queueStatus.hidden = true;
                            }
                            if (streamingDiv) {
                                streamingDiv.classList.remove(
                                    "streaming-msg",
                                );
                                streamingDiv.classList.add("agent-msg");
                                streamingDiv = null;
                            }
                            if (discardTurn) {
                                discardTurn = false;
                            } else {
                                if (liveTransDiv) {
                                    liveTransDiv.remove();
                                    liveTransDiv = null;
                                }
                                if (!isRecording && !isPlayingAudio) {
                                    returnIdle();
                                }
                            }
                        } else if (text.startsWith("[TRANS:")) {
                            if (discardTurn) return;
                            const liveText = text.substring(
                                7,
                                text.length - 1,
                            );
                            if (!liveTransDiv) {
                                liveTransDiv = document.createElement("div");
                                liveTransDiv.className = "message user-msg";
                                conversation.appendChild(liveTransDiv);
                            }
                            liveTransDiv.textContent = liveText;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[STREAM:")) {
                            if (discardTurn) return;
                            const token = text.substring(8, text.length - 1);
                            if (!streamingDiv) {
                                streamingDiv = document.createElement("div");
                                streamingDiv.className =
                                    "message streaming-msg";
                                conversation.appendChild(streamingDiv);
                            }
                            streamingDiv.textContent += token;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[TOOL:")) {
                            if (discardTurn) return;
                            showToolIcon(
                                text.substring("[TOOL:".length, text.length - 1),
                            );
                        } else if (text.startsWith("[ERROR:")) {
                            addMessage(text, "error");
                        } else if (text.startsWith("[QUEUE:")) {
                            const pos = parseInt(
                                text.substring("[QUEUE:".length, text.length - 1),
                                10,
                            );
                            if (pos > 0) {
                                queueStatus.textContent =
                                    pos === 1
                                        ? "waiting in queue..."
                                        : `waiting in queue... (position ${pos})`;
                                queueStatus.hidden = false;
                            } else {
                                queueStatus.textContent = "";
                                queueStatus.hidden = true;
                            }
                        } else {
                            if (liveTransDiv) {
                                liveTransDiv.remove();
                                liveTransDiv = null;
                            }
                            const isUser = text.startsWith("You:");
                            const clean = isUser ? text.substring(5) : text;
                            addMessage(clean, isUser ? "user" : "agent");
                        }
                    }
                };
            }

            connectWebSocket();

            const TOOL_ICONS = {
                get_weather: "🌤️",
                calculator: "🧮",
                wikipedia: "📖",
                exchange_rate: "💱",
                world_time: "🕐",
                dictionary: "📚",
                search_document: "📄",
            };

            function showToolIcon(name) {
                const icon = TOOL_ICONS[name] || "🛠️";
                const div = document.createElement("div");
                div.className = "message tool-icon";
                div.textContent = icon;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            function playAudio(url) {
                isPlayingAudio = true;
                const audio = new Audio(url);
                currentAudio = audio;
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    if (currentAudio === audio) currentAudio = null;
                    if (audioQueue.length > 0) {
                        playAudio(audioQueue.shift());
                    } else {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                };
                audio.play();
            }

            function addMessage(text, sender) {
                const div = document.createElement("div");
                div.className = `message ${sender}-msg`;
                div.textContent = text;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            function setSidebarStatus(el, text, state) {
                el.textContent = text;
                el.classList.toggle("error", state === true || state === "error");
                el.classList.toggle("success", state === "success");
                el.classList.remove("show");
                void el.offsetWidth; // restart the fade-in on every message
                el.classList.add("show");
            }

            async function parseResponse(res) {
                const ct = res.headers.get("content-type") || "";
                if (ct.includes("application/json")) {
                    return await res.json();
                }
                const text = (await res.text())
                    .replace(/<[^>]*>/g, " ")
                    .replace(/\s+/g, " ")
                    .trim();
                if (res.status === 413) {
                    return {
                        detail:
                            "file rejected as too large by the server/proxy (413) — " +
                            "check the ingress proxy-body-size limit",
                    };
                }
                return {
                    detail:
                        `the server returned an HTML page instead of JSON (HTTP ${res.status}) — ` +
                        "the request may not have reached the backend",
                };
            }

            function openSidebar() {
                document.body.classList.add("sidebar-open");
            }
            function closeSidebar() {
                document.body.classList.remove("sidebar-open");
            }

            sidebarToggle.addEventListener("click", openSidebar);
            sidebarClose.addEventListener("click", closeSidebar);
            sidebarBackdrop.addEventListener("click", closeSidebar);
            document.addEventListener("keydown", (e) => {
                if (e.key === "Escape") closeSidebar();
            });

            async function loadState() {
                try {
                    const res = await fetch("/state");
                    const data = await parseResponse(res);
                    if (!res.ok) {
                        throw new Error(data.detail || res.statusText);
                    }
                    promptInput.value = data.custom_prompt || data.default_prompt || "";
                    renderDoc(data.doc);
                    presetSelect.value = data.active_preset || "";
                    setSidebarStatus(promptStatus, "");
                } catch (e) {
                    setSidebarStatus(docStatus, `couldn't load settings: ${e.message}`, true);
                }
            }

            async function loadPresets() {
                try {
                    const res = await fetch("/presets");
                    const data = await parseResponse(res);
                    if (!res.ok) throw new Error(data.detail || res.statusText);
                    presetSelect.innerHTML = "";
                    const none = document.createElement("option");
                    none.value = "";
                    none.textContent = "Custom";
                    presetSelect.appendChild(none);
                    for (const p of data.presets || []) {
                        const opt = document.createElement("option");
                        opt.value = p.slug;
                        opt.textContent = p.name;
                        presetSelect.appendChild(opt);
                    }
                    presetSelect.value = data.active || "";
                } catch (e) {
                    setSidebarStatus(presetStatus, `couldn't load presets: ${e.message}`, true);
                }
            }

            presetSelect.addEventListener("change", async () => {
                const slug = presetSelect.value;
                try {
                    if (slug) {
                        setSidebarStatus(presetStatus, "activating preset...");
                        const res = await fetch("/presets/activate", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" },
                            body: JSON.stringify({ slug }),
                        });
                        const data = await parseResponse(res);
                        if (!res.ok) throw new Error(data.detail || res.statusText);
                        promptInput.value = data.custom_prompt || data.default_prompt || "";
                        renderDoc(data.doc);
                        setSidebarStatus(presetStatus, "preset activated", "success");
                    } else {
                        setSidebarStatus(presetStatus, "clearing preset...");
                        const res = await fetch("/presets/clear", { method: "POST" });
                        const data = await parseResponse(res);
                        if (!res.ok) throw new Error(data.detail || res.statusText);
                        promptInput.value = data.default_prompt || "";
                        renderDoc(null);
                        setSidebarStatus(presetStatus, "preset cleared", "success");
                    }
                } catch (e) {
                    setSidebarStatus(presetStatus, `preset error: ${e.message}`, true);
                }
            });

            function renderDoc(doc) {
                if (!doc) {
                    docStatus.innerHTML = "";
                    setSidebarStatus(docStatus, "No document loaded");
                    return;
                }
                const filename = doc.filename || "document";
                const download = document.createElement("a");
                download.className = "doc-download";
                download.href = "/document/download";
                download.download = filename;
                download.title = `Download ${filename}`;
                download.setAttribute("aria-label", `Download ${filename}`);
                download.textContent = filename;
                const remove = document.createElement("button");
                remove.className = "doc-remove";
                remove.textContent = "Remove document";
                remove.addEventListener("click", async () => {
                    try {
                        await fetch("/upload", { method: "DELETE" });
                        renderDoc(null);
                        await loadPresets();
                    } catch (e) {
                        setSidebarStatus(docStatus, "remove failed", true);
                    }
                });
                docStatus.innerHTML = "";
                docStatus.appendChild(download);
                docStatus.appendChild(remove);
            }

            promptSave.addEventListener("click", async () => {
                const prompt = promptInput.value.trim();
                setSidebarStatus(promptStatus, "saving...");
                try {
                    const res = await fetch("/prompt", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt }),
                    });
                    const data = await parseResponse(res);
                    if (!res.ok) {
                        throw new Error(data.detail || res.statusText);
                    }
                    setSidebarStatus(promptStatus, "saved", "success");
                    await loadPresets();
                } catch (e) {
                    setSidebarStatus(promptStatus, `save failed: ${e.message}`, true);
                }
            });

            promptReset.addEventListener("click", async () => {
                setSidebarStatus(promptStatus, "resetting...");
                try {
                    const res = await fetch("/prompt", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({ prompt: "" }),
                    });
                    if (!res.ok) throw new Error(res.statusText);
                    await loadState();
                    setSidebarStatus(promptStatus, "reset to default", "success");
                } catch (e) {
                    setSidebarStatus(promptStatus, `reset failed: ${e.message}`, true);
                }
            });

            sidebarUpload.addEventListener("click", () => fileInput.click());

            fileInput.addEventListener("change", async () => {
                const file = fileInput.files[0];
                fileInput.value = "";
                if (!file) return;
                if (!file.name.toLowerCase().endsWith(".pdf") && !file.name.toLowerCase().endsWith(".txt")) {
                    setSidebarStatus(docStatus, "Only PDF and TXT files are supported", true);
                    return;
                }
                if (file.size > 15 * 1024 * 1024) {
                    const mb = (file.size / 1024 / 1024).toFixed(1);
                    setSidebarStatus(
                        docStatus,
                        `${file.name} is ${mb} MB — the server limit is 20 MB, ` +
                            "but very large files may still be rejected. Try a smaller file.",
                        true,
                    );
                    return;
                }
                setSidebarStatus(docStatus, `uploading ${file.name}...`);
                const form = new FormData();
                form.append("file", file);
                try {
                    const res = await fetch("/upload", { method: "POST", body: form });
                    const data = await parseResponse(res);
                    if (!res.ok) {
                        throw new Error(data.detail || res.statusText);
                    }
                    renderDoc(data);
                    await loadPresets();
                } catch (e) {
                    setSidebarStatus(docStatus, `upload failed: ${e.message}`, true);
                }
            });

loadState();
            loadPresets();
            setIdlePrompt("idle");

            async function ensureListen() {
                if (listenAnalyser) return;
                try {
                    listenCtx = new AudioContext();
                    listenStream = await navigator.mediaDevices.getUserMedia({
                        audio: true,
                    });
                    const source = listenCtx.createMediaStreamSource(listenStream);
                    listenAnalyser = listenCtx.createAnalyser();
                    listenAnalyser.fftSize = 256;
                    listenAnalyser.smoothingTimeConstant = 0.8;
                    source.connect(listenAnalyser);
                } catch (e) {
                    listenCtx = null;
                    listenAnalyser = null;
                    listenStream = null;
                }
            }

            async function startRecording() {
                if (isRecording) return;
                cancelPendingStart = false;
                if (isPlayingAudio) {
                    // interrupt ongoing assistant playback
                    stopAllAudio();
                    discardTurn = true;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send("CANCEL");
                    }
                }
                if (liveTransDiv) {
                    liveTransDiv.remove();
                    liveTransDiv = null;
                }
                if (streamingDiv) {
                    streamingDiv.classList.remove("streaming-msg");
                    streamingDiv.classList.add("agent-msg");
                    streamingDiv = null;
                }
                state = "recording";
                setActive(true);
                setAgent(false);
                setIdlePrompt("recording");
                try {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        idlePrompt.textContent = "still connecting...";
                        setActive(false);
                        state = "idle";
                        return;
                    }

                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: 16000, channelCount: 1 },
                    });

                    audioContext = new AudioContext({ sampleRate: 16000 });

                    if (player.ctx && player.ctx.state === "suspended") {
                        player.ctx.resume();
                    }

                    const source = audioContext.createMediaStreamSource(stream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);
                    micAnalyser = audioContext.createAnalyser();
                    micAnalyser.fftSize = 256;
                    micAnalyser.smoothingTimeConstant = 0.8;

                    processor.onaudioprocess = (e) => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);
                            const pcm16 = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcm16[i] =
                                    Math.max(-1, Math.min(1, inputData[i])) *
                                    0x7fff;
                            }
                            ws.send(pcm16.buffer);
                        }
                    };

                    source.connect(micAnalyser);
                    micAnalyser.connect(processor);
                    processor.connect(audioContext.destination);

                    isRecording = true;
                    ensureListen();
                    conversation.scrollTop = conversation.scrollHeight;
                    if (cancelPendingStart) {
                        cancelPendingStart = false;
                        stopRecording();
                        return;
                    }
                } catch (err) {
                    cancelPendingStart = false;
                    state = "idle";
                    setActive(false);
                    idlePrompt.textContent =
                        "mic error: " +
                        (navigator.mediaDevices
                            ? err.message
                            : "requires https or localhost");
                }
            }

            function stopRecording() {
                if (!isRecording) {
                    cancelPendingStart = state === "recording";
                    return;
                }

                if (processor) {
                    processor.disconnect();
                    processor = null;
                }
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
                micAnalyser = null;
                if (stream) {
                    stream.getTracks().forEach((t) => t.stop());
                    stream = null;
                }
                isRecording = false;
                state = "processing";
                setActive(true);
                idlePrompt.textContent = "";

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send("stop");
                }
            }

            function isTalkSurface(target) {
                if (!(target instanceof Element)) return false;
                if (document.body.classList.contains("sidebar-open")) return false;
                return !target.closest(
                    "a, button, input, textarea, select, label, audio, video, [data-no-talk]",
                );
            }

            function clearTouchHold() {
                if (touchHoldTimer) {
                    clearTimeout(touchHoldTimer);
                    touchHoldTimer = null;
                }
                touchHoldPointerId = null;
                touchHoldFired = false;
            }

            document.addEventListener("pointerdown", (e) => {
                if (e.pointerType !== "touch" && e.pointerType !== "pen") return;
                if (e.button !== undefined && e.button !== 0) return;
                if (touchHoldPointerId !== null) return;
                if (!isTalkSurface(e.target)) return;
                inputMode = "touch";
                if (state === "idle") setIdlePrompt("idle");
                touchHoldPointerId = e.pointerId;
                touchHoldStartX = e.clientX;
                touchHoldStartY = e.clientY;
                touchHoldFired = false;
                touchHoldTimer = setTimeout(() => {
                    touchHoldFired = true;
                    startRecording();
                }, TOUCH_HOLD_MS);
            });
            document.addEventListener("pointermove", (e) => {
                if (e.pointerId !== touchHoldPointerId) return;
                if (touchHoldFired) return;
                const moved = Math.hypot(
                    e.clientX - touchHoldStartX,
                    e.clientY - touchHoldStartY,
                );
                if (moved > TOUCH_MOVE_PX) clearTouchHold();
            });
            function endTouchHold(e) {
                if (e.pointerId !== touchHoldPointerId) return;
                const fired = touchHoldFired;
                clearTouchHold();
                if (fired) stopRecording();
            }
            document.addEventListener("pointerup", endTouchHold);
            document.addEventListener("pointercancel", endTouchHold);
            document.addEventListener("contextmenu", (e) => {
                if (touchHoldPointerId !== null && isTalkSurface(e.target)) {
                    e.preventDefault();
                }
            });

            document.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    if (e.target.matches("input, textarea")) return;
                    e.preventDefault();
                    inputMode = "keyboard";
                    if (!e.repeat) startRecording();
                }
            });
            document.addEventListener("keyup", (e) => {
                if (e.code === "Space") {
                    if (e.target.matches("input, textarea")) return;
                    e.preventDefault();
                    stopRecording();
                }
            });
        </script>
    </body>
</html>
