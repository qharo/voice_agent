<!doctype html>
<html>
    <head>
        <title>Voice Agent</title>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap"
            rel="stylesheet"
        />
        <style>
            :root {
                --green: #a5d6a7;
                --black: #000000;
                --white: #ffffff;
                --user-text: var(--black);
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                font-family:
                    "Roboto",
                    -apple-system,
                    BlinkMacSystemFont,
                    "Segoe UI",
                    sans-serif;
                background: var(--green);
                color: var(--black);
                transition: background-color 0.6s ease;
                overflow: hidden;
            }
            body.active {
                background: var(--black);
                color: var(--white);
                --user-text: var(--green);
            }
            #app {
                position: relative;
                height: 100vh;
                display: flex;
                flex-direction: column;
            }
            #conversation {
                flex: 1;
                width: min(60%, 760px);
                margin: 0 auto;
                padding: 28px 0;
                overflow-y: auto;
                display: flex;
                flex-direction: column;
                gap: 12px;
                scrollbar-width: none;
            }
            #conversation::-webkit-scrollbar {
                display: none;
            }
            @media (max-width: 768px) {
                #conversation {
                    width: 90%;
                }
            }
            .message {
                white-space: pre-wrap;
                word-wrap: break-word;
                font-size: 20px;
                line-height: 1.55;
                width: 100%;
                max-width: none;
            }
            .user-msg {
                align-self: flex-end;
                color: var(--user-text);
                text-align: right;
            }
            .tool-icon {
                align-self: flex-start;
                font-size: 22px;
                color: var(--white);
                line-height: 1.2;
            }
            .agent-msg {
                align-self: flex-start;
                color: var(--white);
                text-align: left;
            }
            .streaming-msg {
                align-self: flex-start;
                color: var(--white);
            }
            .error-msg {
                align-self: center;
                color: #ffd6d6;
            }
            #idlePrompt {
                flex-shrink: 0;
                padding: 0 0 42px;
                text-align: center;
                font-size: 20px;
                font-weight: 500;
                letter-spacing: 0.3px;
                color: var(--black);
            }
            body.active #idlePrompt {
                display: none;
            }
        </style>
    </head>
    <body>
        <div id="app">
            <div id="conversation"></div>
            <div id="idlePrompt">press space to speak now</div>
        </div>

        <script>
            const conversation = document.getElementById("conversation");
            const idlePrompt = document.getElementById("idlePrompt");

            let ws = null;
            let audioContext = null;
            let processor = null;
            let stream = null;
            let isRecording = false;
            let state = "idle"; // idle | recording | processing | agent
            let streamingDiv = null;
            let liveTransDiv = null;
            let audioQueue = [];
            let currentAudio = null;
            let isPlayingAudio = false;
            let discardTurn = false;
            let shouldReconnect = true;

            const player = {
                ctx: null,
                active: false,
                sampleRate: 24000,
                nextPlayTime: 0,
                sources: [],
                start(sr) {
                    if (this.ctx) {
                        if (this.ctx.state === "suspended") this.ctx.resume();
                    } else {
                        this.ctx = new (window.AudioContext ||
                            window.webkitAudioContext)();
                        this.ctx.resume();
                    }
                    this.sampleRate = sr;
                    this.active = true;
                    this.sources = [];
                    this.nextPlayTime = this.ctx.currentTime + 0.15;
                    isPlayingAudio = true;
                },
                push(buffer) {
                    if (!this.active) return;
                    const n = buffer.byteLength / 2;
                    const i16 = new Int16Array(buffer);
                    const f32 = new Float32Array(n);
                    for (let i = 0; i < n; i++) {
                        f32[i] = Math.max(-1, Math.min(1, i16[i] / 32768));
                    }
                    const audioBuffer = this.ctx.createBuffer(
                        1,
                        n,
                        this.sampleRate,
                    );
                    audioBuffer.copyToChannel(f32, 0);
                    const src = this.ctx.createBufferSource();
                    src.buffer = audioBuffer;
                    src.connect(this.ctx.destination);
                    const when = Math.max(
                        this.nextPlayTime,
                        this.ctx.currentTime,
                    );
                    src.start(when);
                    this.nextPlayTime = when + n / this.sampleRate;
                    this.sources.push(src);
                    src.onended = () => {
                        this.sources.shift();
                        if (!this.active && this.sources.length === 0) {
                            isPlayingAudio = false;
                            if (state === "agent") returnIdle();
                        }
                    };
                },
                end() {
                    this.active = false;
                    if (this.sources.length === 0) {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                },
                stop() {
                    this.active = false;
                    this.sources.forEach((src) => {
                        try {
                            src.stop();
                        } catch (e) {}
                    });
                    this.sources = [];
                    isPlayingAudio = false;
                },
            };

            function setActive(on) {
                document.body.classList.toggle("active", on);
            }

            function stopAllAudio() {
                player.stop();
                if (currentAudio) {
                    currentAudio.pause();
                    currentAudio = null;
                }
                audioQueue.forEach((url) => URL.revokeObjectURL(url));
                audioQueue = [];
                isPlayingAudio = false;
            }

            function returnIdle() {
                state = "idle";
                setActive(false);
            }

            function connectWebSocket() {
                const protocol =
                    window.location.protocol === "https:" ? "wss:" : "ws:";
                ws = new WebSocket(
                    `${protocol}//${window.location.hostname}/ws`,
                );
                ws.binaryType = "arraybuffer";

                ws.onopen = () => {
                    if (!isRecording && !isPlayingAudio) {
                        idlePrompt.textContent = "press space to speak now";
                    }
                };

                ws.onclose = () => {
                    if (shouldReconnect) {
                        idlePrompt.textContent = "reconnecting...";
                        setTimeout(connectWebSocket, 1000);
                    }
                };

                ws.onmessage = (event) => {
                    if (event.data instanceof ArrayBuffer) {
                        if (discardTurn) return;
                        if (player.active) {
                            player.push(event.data);
                        } else {
                            const blob = new Blob([event.data], {
                                type: "audio/wav",
                            });
                            const audioUrl = URL.createObjectURL(blob);
                            if (isPlayingAudio) {
                                audioQueue.push(audioUrl);
                            } else {
                                playAudio(audioUrl);
                            }
                        }
                    } else {
                        const text = event.data;

                        if (text.startsWith("[AUDIO_BEGIN:")) {
                            if (discardTurn) return;
                            const meta = text.substring(
                                "[AUDIO_BEGIN:".length,
                                text.length - 1,
                            );
                            const sr = parseInt(meta.split(":")[0], 10);
                            state = "agent";
                            setActive(true);
                            player.start(sr);
                        } else if (text === "[AUDIO_END]") {
                            player.end();
                        } else if (text === "[END]") {
                            if (streamingDiv) {
                                streamingDiv.classList.remove(
                                    "streaming-msg",
                                );
                                streamingDiv.classList.add("agent-msg");
                                streamingDiv = null;
                            }
                            if (discardTurn) {
                                discardTurn = false;
                            } else {
                                if (liveTransDiv) {
                                    liveTransDiv.remove();
                                    liveTransDiv = null;
                                }
                                if (!isRecording) {
                                    returnIdle();
                                }
                            }
                        } else if (text.startsWith("[TRANS:")) {
                            if (discardTurn) return;
                            const liveText = text.substring(
                                7,
                                text.length - 1,
                            );
                            if (!liveTransDiv) {
                                liveTransDiv = document.createElement("div");
                                liveTransDiv.className = "message user-msg";
                                conversation.appendChild(liveTransDiv);
                            }
                            liveTransDiv.textContent = liveText;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[STREAM:")) {
                            if (discardTurn) return;
                            const token = text.substring(8, text.length - 1);
                            if (!streamingDiv) {
                                streamingDiv = document.createElement("div");
                                streamingDiv.className =
                                    "message streaming-msg";
                                conversation.appendChild(streamingDiv);
                            }
                            streamingDiv.textContent += token;
                            conversation.scrollTop = conversation.scrollHeight;
                        } else if (text.startsWith("[TOOL:")) {
                            if (discardTurn) return;
                            showToolIcon(
                                text.substring("[TOOL:".length, text.length - 1),
                            );
                        } else if (text.startsWith("[ERROR:")) {
                            addMessage(text, "error");
                        } else {
                            if (liveTransDiv) {
                                liveTransDiv.remove();
                                liveTransDiv = null;
                            }
                            const isUser = text.startsWith("You:");
                            const clean = isUser ? text.substring(5) : text;
                            addMessage(clean, isUser ? "user" : "agent");
                        }
                    }
                };
            }

            connectWebSocket();

            const TOOL_ICONS = { get_weather: "🌤️", calculator: "🧮" };

            function showToolIcon(name) {
                const icon = TOOL_ICONS[name] || "🛠️";
                const div = document.createElement("div");
                div.className = "message tool-icon";
                div.textContent = icon;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            function playAudio(url) {
                isPlayingAudio = true;
                const audio = new Audio(url);
                currentAudio = audio;
                audio.onended = () => {
                    URL.revokeObjectURL(url);
                    if (currentAudio === audio) currentAudio = null;
                    if (audioQueue.length > 0) {
                        playAudio(audioQueue.shift());
                    } else {
                        isPlayingAudio = false;
                        if (state === "agent") returnIdle();
                    }
                };
                audio.play();
            }

            function addMessage(text, sender) {
                const div = document.createElement("div");
                div.className = `message ${sender}-msg`;
                div.textContent = text;
                conversation.appendChild(div);
                conversation.scrollTop = conversation.scrollHeight;
            }

            async function startRecording() {
                if (isRecording) return;
                if (isPlayingAudio) {
                    // interrupt ongoing assistant playback
                    stopAllAudio();
                    discardTurn = true;
                    if (ws && ws.readyState === WebSocket.OPEN) {
                        ws.send("CANCEL");
                    }
                }
                if (liveTransDiv) {
                    liveTransDiv.remove();
                    liveTransDiv = null;
                }
                if (streamingDiv) {
                    streamingDiv.classList.remove("streaming-msg");
                    streamingDiv.classList.add("agent-msg");
                    streamingDiv = null;
                }
                state = "recording";
                setActive(true);
                try {
                    if (!ws || ws.readyState !== WebSocket.OPEN) {
                        idlePrompt.textContent = "still connecting...";
                        setActive(false);
                        state = "idle";
                        return;
                    }

                    stream = await navigator.mediaDevices.getUserMedia({
                        audio: { sampleRate: 16000, channelCount: 1 },
                    });

                    audioContext = new AudioContext({ sampleRate: 16000 });

                    if (player.ctx && player.ctx.state === "suspended") {
                        player.ctx.resume();
                    }

                    const source = audioContext.createMediaStreamSource(stream);
                    processor = audioContext.createScriptProcessor(4096, 1, 1);

                    processor.onaudioprocess = (e) => {
                        if (ws.readyState === WebSocket.OPEN) {
                            const inputData = e.inputBuffer.getChannelData(0);
                            const pcm16 = new Int16Array(inputData.length);
                            for (let i = 0; i < inputData.length; i++) {
                                pcm16[i] =
                                    Math.max(-1, Math.min(1, inputData[i])) *
                                    0x7fff;
                            }
                            ws.send(pcm16.buffer);
                        }
                    };

                    source.connect(processor);
                    processor.connect(audioContext.destination);

                    isRecording = true;
                } catch (err) {
                    state = "idle";
                    setActive(false);
                    idlePrompt.textContent =
                        "mic error: " +
                        (navigator.mediaDevices
                            ? err.message
                            : "requires https or localhost");
                }
            }

            function stopRecording() {
                if (!isRecording) return;

                if (processor) {
                    processor.disconnect();
                    processor = null;
                }
                if (audioContext) {
                    audioContext.close();
                    audioContext = null;
                }
                if (stream) {
                    stream.getTracks().forEach((t) => t.stop());
                    stream = null;
                }
                isRecording = false;
                state = "processing";
                setActive(true);

                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send("stop");
                }
            }

            document.addEventListener("keydown", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    if (!e.repeat) startRecording();
                }
            });
            document.addEventListener("keyup", (e) => {
                if (e.code === "Space") {
                    e.preventDefault();
                    stopRecording();
                }
            });
        </script>
    </body>
</html>
