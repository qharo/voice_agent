services:
  backend:
    build: ./backend
    env_file:
      - .env
    environment:
      - TTS_ENGINE=piper
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    working_dir: /app

  frontend:
    build: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  huggingface_cache:
